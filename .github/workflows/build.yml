name: Build HealthBoost roothide deb with App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dpkg
        run: brew install dpkg
      
      - name: Compile daemon binary
        run: |
          xcrun --sdk iphoneos clang \
            -framework HealthKit \
            -framework Foundation \
            -arch arm64 -arch arm64e \
            -mios-version-min=13.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -o HealthBoost \
            src/HealthBoostDaemon.m
      
      - name: Verify daemon binary
        run: |
          file HealthBoost
          ls -la HealthBoost
          head -c 4 HealthBoost | xxd
      
      - name: Compile iOS App
        run: |
          xcrun --sdk iphoneos clang \
            -framework UIKit \
            -framework Foundation \
            -arch arm64 -arch arm64e \
            -mios-version-min=13.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -o HealthBoostApp \
            HealthBoostApp/HealthBoostApp.m
      
      - name: Create App bundle
        run: |
          mkdir -p HealthBoost.app
          cp HealthBoostApp HealthBoost.app/HealthBoost
          chmod 755 HealthBoost.app/HealthBoost
          cp -r HealthBoostApp/HealthBoost/* HealthBoost.app/ 2>/dev/null || true
          ls -la HealthBoost.app/
      
      - name: Build package
        run: bash build.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthboost-deb
          path: com.sykes.healthboost_1.0.0-1_iphoneos-arm64e.deb
          retention-days: 30
      
      - name: Show build info
        run: |
          echo "=== Build Complete ==="
          ls -la *.deb
          dpkg-deb -f com.sykes.healthboost_1.0.0-1_iphoneos-arm64e.deb
