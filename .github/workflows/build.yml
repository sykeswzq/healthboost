name: Build HealthBoost roothide deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dpkg
        run: brew install dpkg
      
      - name: Compile daemon binary
        run: |
          xcrun --sdk iphoneos clang \
            -framework HealthKit \
            -framework Foundation \
            -arch arm64 -arch arm64e \
            -mios-version-min=13.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -o HealthBoost \
            src/HealthBoostDaemon.m
      
      - name: Verify binary
        run: |
          file HealthBoost
          ls -la HealthBoost
          head -c 4 HealthBoost | xxd
      
      - name: Build package
        run: bash build.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthboost-deb
          path: com.sykes.healthboost_1.0.0-1_iphoneos-arm64e.deb
          retention-days: 30
      
      - name: Show build info
        run: |
          echo "=== Build Complete ==="
          ls -la *.deb
          dpkg-deb -f com.sykes.healthboost_1.0.0-1_iphoneos-arm64e.deb
