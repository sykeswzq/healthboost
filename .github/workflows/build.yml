name: Build HealthBoost roothide deb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clear build cache
        run: |
          rm -rf ~/Library/Caches/org.llvm.clang/*/ModuleCache.noindex/
          rm -rf ~/Library/Developer/Xcode/DerivedData/
          echo "Cache cleared"

      - name: Install build tools
        run: |
          brew install dpkg
          brew install ldid-procursus 2>/dev/null || brew install procursus/ldid/ldid 2>/dev/null || { echo "ERROR: ldid install failed"; exit 1; }
          command -v ldid >/dev/null 2>&1 || { echo "ERROR: ldid still not available"; exit 1; }
          ldid -e /usr/bin/true >/dev/null 2>&1 && echo "ldid OK" || echo "WARN: ldid self-test skipped"

      - name: Build package (daemon + app)
        run: bash build.sh

      - name: Verify binary
        run: |
          # 版本号会递增，用通配符定位，避免硬编码文件名导致找不到
          DEB=$(ls com.sykes.healthboost_*_iphoneos-arm64e.deb | head -1)
          echo "deb file: $DEB"
          echo "=== control Version ==="
          dpkg-deb -f "$DEB" Version
          echo "=== deb contents ==="
          dpkg-deb -c "$DEB"
          echo "=== app executable header ==="
          mkdir -p /tmp/hbcheck
          dpkg-deb -x "$DEB" /tmp/hbcheck
          APPBIN=/tmp/hbcheck/var/jb/Applications/HealthBoost.app/HealthBoostApp
          ls -la "$APPBIN"
          echo "app header: $(head -c 4 "$APPBIN" | xxd -p)"
          echo "=== app entitlements (确认含 no-sandbox) ==="
          ldid -e "$APPBIN" 2>/dev/null | grep -E "no-sandbox|healthkit" || echo "WARN: no-sandbox/healthkit not found in entitlements"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthboost-deb
          path: "*.deb"
          retention-days: 30
